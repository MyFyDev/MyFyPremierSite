AWSTemplateFormatVersion: '2010-09-09'
Description: End-to-end deployment for MyFy Premier Site

Resources:
  stgMyFyPremierSite:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.small
      ImageId: ami-060945ab3b17e716d
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      SubnetId: !ImportValue test-AppSubnet
      SecurityGroupIds:
        - !ImportValue test-AppSecurityGroup
      # The staging deploy key (EC2_ID_RSA), imported into EC2 under this name on
      # 2026-11-23. daniel-ec2-instance-ssh-key was rotated out on Nov 20, so an
      # instance launched with it refuses the deploy's login. Changing KeyName
      # replaces the instance.
      KeyName: myfy-staging-deploy-2026-11-20
      Tags:
        - Key: Name
          Value: stgMyFyPremierSite

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref stgMyFyPremierSite
      EIP: "100.48.27.187"
