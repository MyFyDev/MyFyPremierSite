AWSTemplateFormatVersion: '2010-09-09'
Description: End-to-end deployment for MyFy Premier Site

Resources:
  stgMyFyPremierSite:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.small
      ImageId: ami-060945ab3b17e716d
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      SubnetId: !ImportValue test-AppSubnet
      SecurityGroupIds:
        - !ImportValue test-AppSecurityGroup
      KeyName: daniel-ec2-instance-ssh-key
      Tags:
        - Key: Name
          Value: stgMyFyPremierSite

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref stgMyFyPremierSite
      EIP: "100.48.27.187"
